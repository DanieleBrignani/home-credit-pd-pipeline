name: creditrisk
version: "1.0.0"
config-version: 2
profile: creditrisk
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
vars:
  feature_pipeline_version: "fp-1.0.0"
  split_salt: "hc-split-v1"
  train_pct: 70      # hash bucket < 70 -> train
  valid_pct: 15      # 70 <= bucket < 85 -> valid ; remaining 15 -> test (untouched until final evaluation)
models:
  creditrisk:
    staging: {+materialized: table, +schema: staging}
    intermediate: {+materialized: table, +schema: intermediate}
    marts: {+materialized: table, +schema: marts}
