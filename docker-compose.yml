name: creditrisk
services:
  postgres:
    image: postgres:16
    shm_size: 2gb   # parallel query workers need /dev/shm; the 64MB default fails on the 27M-row table tests
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-creditrisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-creditrisk}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    command: ["postgres", "-c", "shared_buffers=1GB", "-c", "work_mem=128MB", "-c", "max_wal_size=4GB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-creditrisk}"]
      interval: 5s
      retries: 20

  mlflow:
    build: {context: ., dockerfile: infra/Dockerfile.mlflow}
    environment:
      MLFLOW_BACKEND: postgresql://${POSTGRES_USER:-creditrisk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-creditrisk}
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER:-creditrisk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-creditrisk}
      --artifacts-destination /mlartifacts --serve-artifacts
    ports: ["127.0.0.1:${MLFLOW_PORT:-5000}:5000"]
    volumes: ["mlartifacts:/mlartifacts"]
    depends_on: {postgres: {condition: service_healthy}}

  api:
    build: {context: ., dockerfile: infra/Dockerfile.api}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-creditrisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-creditrisk}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      AUDIT_HASH_SALT: ${AUDIT_HASH_SALT:?set AUDIT_HASH_SALT in .env}
      MODEL_ALIAS: champion
      API_KEY_SHA256S: ${API_KEY_SHA256S:?set API_KEY_SHA256S in .env (sha256 of the API key; see docs/runbook.md)}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN in .env}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-1200}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]   # loopback only (admin/metrics); public traffic goes through the TLS proxy
    depends_on: {postgres: {condition: service_healthy}, mlflow: {condition: service_started}}

  proxy:
    image: caddy:2
    ports: ["${TLS_PORT:-8443}:8443"]
    volumes: ["./infra/Caddyfile:/etc/caddy/Caddyfile:ro", "caddydata:/data"]
    depends_on: [api]

  pipeline:
    profiles: ["pipeline"]          # not started by `up`; run on demand
    build: {context: ., dockerfile: infra/Dockerfile.pipeline}
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-creditrisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-creditrisk}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    volumes: ["./data/raw:/data/raw", "./reports:/app/reports"]
    depends_on: {postgres: {condition: service_healthy}, mlflow: {condition: service_started}}

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes: ["./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./infra/alerts.yml:/etc/prometheus/alerts.yml:ro"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    depends_on: [prometheus]

volumes:
  caddydata:
  pgdata:
  mlartifacts:
